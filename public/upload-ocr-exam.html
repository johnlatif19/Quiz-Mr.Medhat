<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحويل صور إلى أسئلة - Quiz Mr. Medhat</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #f0f4f8;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }
        .container { max-width: 900px; margin: 0 auto; }
        .header {
            background: white;
            padding: 20px 30px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .header h1 { font-size: 22px; color: #1a2a3a; }
        .header h1 span { color: #1d6f9c; }
        .btn-back {
            padding: 8px 20px;
            background: #6c757d;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
        }
        .btn-back:hover { background: #5a6268; }
        .card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            margin-bottom: 20px;
        }
        .card-title {
            font-size: 18px;
            font-weight: 600;
            color: #1a2a3a;
            margin-bottom: 15px;
        }
        .form-group { margin-bottom: 15px; }
        .form-group label {
            display: block;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 5px;
            font-size: 14px;
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 8px 12px;
            border: 2px solid #dce4ec;
            border-radius: 6px;
            font-size: 14px;
        }
        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #2c6f9c;
        }
        .btn {
            padding: 10px 25px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
        }
        .btn-success { background: #27ae60; color: white; }
        .btn-success:hover { background: #219a52; }
        .btn-primary { background: #2c6f9c; color: white; }
        .btn-primary:hover { background: #1f5a7a; }
        .btn-warning { background: #f39c12; color: white; }
        .btn-warning:hover { background: #d68910; }
        .btn-danger { background: #e74c3c; color: white; }
        .btn-danger:hover { background: #c0392b; }
        
        .upload-area {
            border: 3px dashed #8e44ad;
            border-radius: 12px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: #f5eef9;
        }
        .upload-area:hover {
            border-color: #6c3483;
            background: #ede3f5;
        }
        .upload-area.dragover {
            border-color: #27ae60;
            background: #eafaf1;
        }
        .upload-area .icon { font-size: 48px; display: block; margin-bottom: 10px; }
        .upload-area .text { color: #6c3483; font-size: 16px; font-weight: 500; }
        .upload-area .sub-text { color: #7f8c8d; font-size: 13px; margin-top: 5px; }
        
        .image-preview-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        .image-preview-item {
            position: relative;
            border: 2px solid #dce4ec;
            border-radius: 8px;
            overflow: hidden;
            aspect-ratio: 4/3;
            background: #f7f9fc;
        }
        .image-preview-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .image-preview-item .remove-btn {
            position: absolute;
            top: 5px;
            right: 5px;
            background: rgba(231, 76, 60, 0.9);
            color: white;
            border: none;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .image-preview-item .remove-btn:hover { background: #c0392b; }
        .image-preview-item .ocr-status {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 4px 8px;
            font-size: 11px;
            text-align: center;
        }
        .image-preview-item .ocr-status.done { background: rgba(39, 174, 96, 0.8); }
        .image-preview-item .ocr-status.failed { background: rgba(231, 76, 60, 0.8); }

        .question-item {
            background: #f7f9fc;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            border: 2px solid #8e44ad;
        }
        .question-item .q-number {
            font-weight: 600;
            color: #6c3483;
            margin-bottom: 10px;
        }
        .question-options {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .question-options .opt-group { flex: 1; min-width: 100px; }
        .question-options .opt-group label { font-size: 12px; color: #7f8c8d; display: block; }
        .question-options .opt-group input { width: 100%; padding: 4px 8px; border: 1px solid #dce4ec; border-radius: 4px; }
        .hidden { display: none; }
        .loading { opacity: 0.6; pointer-events: none; }

        .ocr-progress {
            background: #f5eef9;
            border-radius: 8px;
            padding: 15px;
            margin: 15px 0;
            border: 1px solid #d5b8e8;
        }
        .ocr-progress .bar {
            width: 100%;
            height: 8px;
            background: #dce4ec;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 8px;
        }
        .ocr-progress .bar .fill {
            height: 100%;
            background: linear-gradient(90deg, #8e44ad, #9b59b6);
            border-radius: 10px;
            transition: width 0.5s ease;
            width: 0%;
        }
        .ocr-progress .status-text { color: #6c3483; font-weight: 500; }

        @media (max-width: 768px) {
            .header { flex-direction: column; align-items: stretch; text-align: center; }
            .image-preview-grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 تحويل صور إلى <span>أسئلة</span></h1>
            <div>
                <a href="/dashboard" class="btn-back">⬅ العودة للوحة التحكم</a>
            </div>
        </div>

        <div class="card">
            <div style="background:#f5eef9;padding:12px 16px;border-radius:8px;margin-bottom:20px;border:1px solid #d5b8e8;">
                <strong>🤖 كيف يعمل:</strong> ارفع صور الأسئلة وسيقوم النظام بتحويلها تلقائياً إلى أسئلة نصية مع خيارات الإجابة. يمكنك تعديل النصوص والخيارات بعد التحويل.
            </div>

            <form id="examForm" onsubmit="createOcrExam(event)">
                <div class="form-group">
                    <label>اختر المجموعة</label>
                    <select id="groupSelect" required>
                        <option value="">-- اختر مجموعة --</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>نوع الأسئلة</label>
                    <div style="display:flex;gap:15px;margin-top:5px;">
                        <label style="display:flex;align-items:center;gap:5px;font-weight:normal;cursor:pointer;">
                            <input type="radio" name="questionType" value="multiple_choice" checked> اختيار من متعدد
                        </label>
                        <label style="display:flex;align-items:center;gap:5px;font-weight:normal;cursor:pointer;">
                            <input type="radio" name="questionType" value="essay"> مقالي (نص)
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label>رفع صور الأسئلة</label>
                    <div class="upload-area" id="uploadArea">
                        <span class="icon">📸</span>
                        <div class="text">اسحب الصور هنا أو انقر للاختيار</div>
                        <div class="sub-text">يدعم JPG, PNG, GIF - حتى 5MB لكل صورة</div>
                        <input type="file" id="fileInput" accept="image/*" multiple style="display:none;">
                    </div>
                    <div id="imagePreviewGrid" class="image-preview-grid"></div>
                </div>

                <div id="ocrProgress" class="ocr-progress hidden">
                    <div class="status-text">⏳ جاري تحويل الصور إلى أسئلة...</div>
                    <div class="bar"><div class="fill" id="ocrProgressFill"></div></div>
                </div>

                <div id="questionsContainer"></div>

                <div style="display:flex;gap:10px;margin-top:15px;flex-wrap:wrap;">
                    <button type="submit" class="btn btn-success" id="submitBtn">✅ نشر الامتحان</button>
                    <button type="button" class="btn btn-warning" onclick="window.location.href='/dashboard'">إلغاء</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_URL = window.location.origin;
        const token = localStorage.getItem('token');

        if (!token) {
            window.location.href = '/login';
        }

        let uploadedImages = [];
        let ocrResults = [];

        async function loadGroups() {
            try {
                const response = await fetch(`${API_URL}/api/groups`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (response.status === 401 || response.status === 403) {
                    localStorage.removeItem('token');
                    window.location.href = '/login';
                    return;
                }
                const data = await response.json();
                const select = document.getElementById('groupSelect');
                select.innerHTML = '<option value="">-- اختر مجموعة --</option>';
                data.forEach(g => {
                    select.innerHTML += `<option value="${g.id}" data-slug="${g.slug}">${g.name}</option>`;
                });
                if (data.length === 0) {
                    select.innerHTML = '<option value="">لا توجد مجموعات. أضف مجموعة أولاً.</option>';
                }
            } catch (error) {
                console.error('Error loading groups:', error);
            }
        }

        });
