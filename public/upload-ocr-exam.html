<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحويل صور إلى أسئلة - Quiz Mr. Medhat</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #f0f4f8;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }
        .container { max-width: 900px; margin: 0 auto; }
        .header {
            background: white;
            padding: 20px 30px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .header h1 { font-size: 22px; color: #1a2a3a; }
        .header h1 span { color: #1d6f9c; }
        .btn-back {
            padding: 8px 20px;
            background: #6c757d;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
        }
        .btn-back:hover { background: #5a6268; }
        .card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            margin-bottom: 20px;
        }
        .card-title {
            font-size: 18px;
            font-weight: 600;
            color: #1a2a3a;
            margin-bottom: 15px;
        }
        .form-group { margin-bottom: 15px; }
        .form-group label {
            display: block;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 5px;
            font-size: 14px;
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 8px 12px;
            border: 2px solid #dce4ec;
            border-radius: 6px;
            font-size: 14px;
        }
        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #2c6f9c;
        }
        .btn {
            padding: 10px 25px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
        }
        .btn-success { background: #27ae60; color: white; }
        .btn-success:hover { background: #219a52; }
        .btn-primary { background: #2c6f9c; color: white; }
        .btn-primary:hover { background: #1f5a7a; }
        .btn-warning { background: #f39c12; color: white; }
        .btn-warning:hover { background: #d68910; }
        .btn-danger { background: #e74c3c; color: white; }
        .btn-danger:hover { background: #c0392b; }
        
        .upload-area {
            border: 3px dashed #8e44ad;
            border-radius: 12px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: #f5eef9;
        }
        .upload-area:hover {
            border-color: #6c3483;
            background: #ede3f5;
        }
        .upload-area.dragover {
            border-color: #27ae60;
            background: #eafaf1;
        }
        .upload-area .icon { font-size: 48px; display: block; margin-bottom: 10px; }
        .upload-area .text { color: #6c3483; font-size: 16px; font-weight: 500; }
        .upload-area .sub-text { color: #7f8c8d; font-size: 13px; margin-top: 5px; }
        
        .image-preview-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        .image-preview-item {
            position: relative;
            border: 2px solid #dce4ec;
            border-radius: 8px;
            overflow: hidden;
            aspect-ratio: 4/3;
            background: #f7f9fc;
        }
        .image-preview-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .image-preview-item .remove-btn {
            position: absolute;
            top: 5px;
            right: 5px;
            background: rgba(231, 76, 60, 0.9);
            color: white;
            border: none;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .image-preview-item .remove-btn:hover { background: #c0392b; }
        .image-preview-item .ocr-status {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 4px 8px;
            font-size: 11px;
            text-align: center;
        }
        .image-preview-item .ocr-status.done { background: rgba(39, 174, 96, 0.8); }
        .image-preview-item .ocr-status.failed { background: rgba(231, 76, 60, 0.8); }

        .question-item {
            background: #f7f9fc;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            border: 2px solid #8e44ad;
        }
        .question-item .q-number {
            font-weight: 600;
            color: #6c3483;
            margin-bottom: 10px;
        }
        .question-options {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .question-options .opt-group { flex: 1; min-width: 100px; }
        .question-options .opt-group label { font-size: 12px; color: #7f8c8d; display: block; }
        .question-options .opt-group input { width: 100%; padding: 4px 8px; border: 1px solid #dce4ec; border-radius: 4px; }
        .hidden { display: none; }
        .loading { opacity: 0.6; pointer-events: none; }

        .ocr-progress {
            background: #f5eef9;
            border-radius: 8px;
            padding: 15px;
            margin: 15px 0;
            border: 1px solid #d5b8e8;
        }
        .ocr-progress .bar {
            width: 100%;
            height: 8px;
            background: #dce4ec;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 8px;
        }
        .ocr-progress .bar .fill {
            height: 100%;
            background: linear-gradient(90deg, #8e44ad, #9b59b6);
            border-radius: 10px;
            transition: width 0.5s ease;
            width: 0%;
        }
        .ocr-progress .status-text { color: #6c3483; font-weight: 500; }

        @media (max-width: 768px) {
            .header { flex-direction: column; align-items: stretch; text-align: center; }
            .image-preview-grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 تحويل صور إلى <span>أسئلة</span></h1>
            <div>
                <a href="/dashboard" class="btn-back">⬅ العودة للوحة التحكم</a>
            </div>
        </div>

        <div class="card">
            <div style="background:#f5eef9;padding:12px 16px;border-radius:8px;margin-bottom:20px;border:1px solid #d5b8e8;">
                <strong>🤖 كيف يعمل:</strong> ارفع صور الأسئلة وسيقوم النظام بتحويلها تلقائياً إلى أسئلة نصية مع خيارات الإجابة. يمكنك تعديل النصوص والخيارات بعد التحويل.
            </div>

            <form id="examForm" onsubmit="createOcrExam(event)">
                <div class="form-group">
                    <label>اختر المجموعة</label>
                    <select id="groupSelect" required>
                        <option value="">-- اختر مجموعة --</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>نوع الأسئلة</label>
                    <div style="display:flex;gap:15px;margin-top:5px;">
                        <label style="display:flex;align-items:center;gap:5px;font-weight:normal;cursor:pointer;">
                            <input type="radio" name="questionType" value="multiple_choice" checked> اختيار من متعدد
                        </label>
                        <label style="display:flex;align-items:center;gap:5px;font-weight:normal;cursor:pointer;">
                            <input type="radio" name="questionType" value="essay"> مقالي (نص)
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label>رفع صور الأسئلة</label>
                    <div class="upload-area" id="uploadArea">
                        <span class="icon">📸</span>
                        <div class="text">اسحب الصور هنا أو انقر للاختيار</div>
                        <div class="sub-text">يدعم JPG, PNG, GIF - حتى 5MB لكل صورة</div>
                        <input type="file" id="fileInput" accept="image/*" multiple style="display:none;">
                    </div>
                    <div id="imagePreviewGrid" class="image-preview-grid"></div>
                </div>

                <div id="ocrProgress" class="ocr-progress hidden">
                    <div class="status-text">⏳ جاري تحويل الصور إلى أسئلة...</div>
                    <div class="bar"><div class="fill" id="ocrProgressFill"></div></div>
                </div>

                <div id="questionsContainer"></div>

                <div style="display:flex;gap:10px;margin-top:15px;flex-wrap:wrap;">
                    <button type="submit" class="btn btn-success" id="submitBtn">✅ نشر الامتحان</button>
                    <button type="button" class="btn btn-warning" onclick="window.location.href='/dashboard'">إلغاء</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_URL = window.location.origin;
        const token = localStorage.getItem('token');

        if (!token) {
            window.location.href = '/login';
        }

        let uploadedImages = [];
        let ocrResults = [];

        async function loadGroups() {
            try {
                const response = await fetch(`${API_URL}/api/groups`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (response.status === 401 || response.status === 403) {
                    localStorage.removeItem('token');
                    window.location.href = '/login';
                    return;
                }
                const data = await response.json();
                const select = document.getElementById('groupSelect');
                select.innerHTML = '<option value="">-- اختر مجموعة --</option>';
                data.forEach(g => {
                    select.innerHTML += `<option value="${g.id}" data-slug="${g.slug}">${g.name}</option>`;
                });
                if (data.length === 0) {
                    select.innerHTML = '<option value="">لا توجد مجموعات. أضف مجموعة أولاً.</option>';
                }
            } catch (error) {
                console.error('Error loading groups:', error);
            }
        }

        // رفع الصور
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const previewGrid = document.getElementById('imagePreviewGrid');

        uploadArea.addEventListener('click', () => fileInput.click());

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            if (e.dataTransfer.files.length) {
                handleFiles(e.dataTransfer.files);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length) {
                handleFiles(e.target.files);
            }
            fileInput.value = '';
        });

        function handleFiles(files) {
            for (const file of files) {
                if (!file.type.startsWith('image/')) continue;
                if (file.size > 5 * 1024 * 1024) {
                    alert(`الصورة ${file.name} حجمها كبير جداً (أكبر من 5MB)`);
                    continue;
                }
                const reader = new FileReader();
                reader.onload = (e) => {
                    uploadedImages.push({
                        file: file,
                        dataUrl: e.target.result,
                        name: file.name,
                        type: file.type,
                        processed: false
                    });
                    renderPreviews();
                    performOCR();
                };
                reader.readAsDataURL(file);
            }
        }

        function renderPreviews() {
            previewGrid.innerHTML = '';
            uploadedImages.forEach((img, index) => {
                const div = document.createElement('div');
                div.className = 'image-preview-item';
                const statusText = img.processed ? '✅ تم التحويل' : '⏳ جاري...';
                const statusClass = img.processed ? 'done' : '';
                div.innerHTML = `
                    <img src="${img.dataUrl}" alt="${img.name}">
                    <button class="remove-btn" onclick="removeImage(${index})">×</button>
                    <div class="ocr-status ${statusClass}">${statusText}</div>
                `;
                previewGrid.appendChild(div);
            });
        }

        function removeImage(index) {
            uploadedImages.splice(index, 1);
            ocrResults.splice(index, 1);
            renderPreviews();
            generateQuestionsFromOCR();
        }

        // ====== محاكاة OCR (تحويل الصور إلى نص) ======
        // في الواقع الحقيقي، سيتم استخدام خدمة OCR خارجية
        // لكن هنا سنقوم بمحاكاة بسيطة للعرض
        async function performOCR() {
            const progressDiv = document.getElementById('ocrProgress');
            const progressFill = document.getElementById('ocrProgressFill');
            progressDiv.classList.remove('hidden');

            for (let i = 0; i < uploadedImages.length; i++) {
                if (uploadedImages[i].processed) continue;
                
                const img = uploadedImages[i];
                const progress = ((i) / uploadedImages.length) * 100;
                progressFill.style.width = progress + '%';
                
                // محاكاة معالجة OCR
                await new Promise(resolve => setTimeout(resolve, 1500));
                
                // استخراج النص من اسم الملف (محاكاة)
                const fileName = img.name.replace(/\.[^/.]+$/, '');
                const questionText = `سؤال من الصورة: ${fileName}`;
                
                // محاكاة استخراج خيارات
                const options = [
                    `الخيار A لـ ${fileName}`,
                    `الخيار B لـ ${fileName}`,
                    `الخيار C لـ ${fileName}`,
                    `الخيار D لـ ${fileName}`
                ];
                
                ocrResults[i] = {
                    text: questionText,
                    options: options,
                    correct: 0,
                    questionType: document.querySelector('input[name="questionType"]:checked').value || 'multiple_choice',
                    imageData: img.dataUrl,
                    imageMime: img.type
                };
                
                img.processed = true;
                renderPreviews();
                generateQuestionsFromOCR();
            }

            progressFill.style.width = '100%';
            setTimeout(() => {
                progressDiv.classList.add('hidden');
            }, 1000);
        }

        function generateQuestionsFromOCR() {
            const container = document.getElementById('questionsContainer');
            const questionType = document.querySelector('input[name="questionType"]:checked').value;
            
            if (ocrResults.length === 0) {
                container.innerHTML = '<div style="color:#7f8c8d;text-align:center;padding:20px;">قم برفع الصور أولاً لتحويلها إلى أسئلة.</div>';
                return;
            }

            let html = '<div style="margin-top:15px;padding:10px;background:#f5eef9;border-radius:8px;border:1px solid #8e44ad;">';
            html += `<strong>🤖 تم تحويل ${ocrResults.length} صورة إلى أسئلة</strong>`;
            html += ' <span style="color:#7f8c8d;font-size:13px;">(يمكنك تعديل النصوص والخيارات)</span>';
            html += '</div>';

            html += '<div style="margin-top:15px;">';
            ocrResults.forEach((result, idx) => {
                const isEssay = result.questionType === 'essay' || questionType === 'essay';
                html += `
                    <div class="question-item">
                        <div class="q-number">السؤال ${idx + 1} ${isEssay ? '📝 مقالي' : '✅ اختيار من متعدد'}</div>
                        <div style="margin-bottom:10px;">
                            <img src="${result.imageData}" style="max-width:200px;max-height:150px;border-radius:8px;border:1px solid #dce4ec;">
                        </div>
                        <div class="form-group">
                            <label>نص السؤال</label>
                            <input type="text" id="ocr_q_text_${idx}" value="${result.text.replace(/"/g, '&quot;')}" style="width:100%;padding:6px 10px;border:1px solid #dce4ec;border-radius:4px;">
                        </div>
                        ${isEssay ? `
                            <div class="form-group">
                                <label>إجابة نموذجية (اختياري)</label>
                                <textarea id="ocr_q_essay_${idx}" rows="2" style="width:100%;padding:6px 10px;border:1px solid #dce4ec;border-radius:4px;"></textarea>
                            </div>
                            <input type="hidden" id="ocr_q_type_${idx}" value="essay">
                        ` : `
                        <div class="question-options">
                            ${result.options.map((opt, oi) => `
                                <div class="opt-group">
                                    <label>${['A','B','C','D'][oi]}</label>
                                    <input type="text" id="ocr_q_opt_${idx}_${oi}" value="${opt.replace(/"/g, '&quot;')}">
                                </div>
                            `).join('')}
                        </div>
                        <div class="form-group" style="margin-top:5px;">
                            <label>الإجابة الصحيحة</label>
                            <select id="ocr_q_correct_${idx}" style="padding:4px 8px;border:1px solid #dce4ec;border-radius:4px;">
                                <option value="0">A</option>
                                <option value="1">B</option>
                                <option value="2">C</option>
                                <option value="3">D</option>
                            </select>
                        </div>
                        <input type="hidden" id="ocr_q_type_${idx}" value="multiple_choice">
                        `}
                        <input type="hidden" id="ocr_q_image_${idx}" value="${result.imageData}">
                        <input type="hidden" id="ocr_q_mime_${idx}" value="${result.imageMime}">
                    </div>
                `;
            });
            html += '</div>';
            container.innerHTML = html;
        }

        document.querySelectorAll('input[name="questionType"]').forEach(radio => {
            radio.addEventListener('change', () => {
                // تحديث نوع الأسئلة في OCR Results
                const newType = document.querySelector('input[name="questionType"]:checked').value;
                ocrResults.forEach(r => r.questionType = newType);
                generateQuestionsFromOCR();
            });
        });

        async function createOcrExam(e) {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.classList.add('loading');
            submitBtn.textContent = '⏳ جاري النشر...';

            const groupSelect = document.getElementById('groupSelect');
            const groupId = groupSelect.value;
            const groupSlug = groupSelect.options[groupSelect.selectedIndex]?.dataset?.slug;
            const questionType = document.querySelector('input[name="questionType"]:checked').value;

            if (!groupId) {
                alert('الرجاء اختيار مجموعة.');
                submitBtn.classList.remove('loading');
                submitBtn.textContent = '✅ نشر الامتحان';
                return;
            }

            if (ocrResults.length === 0) {
                alert('الرجاء رفع صورة واحدة على الأقل.');
                submitBtn.classList.remove('loading');
                submitBtn.textContent = '✅ نشر الامتحان';
                return;
            }

            const questions = [];
            for (let i = 0; i < ocrResults.length; i++) {
                const text = document.getElementById(`ocr_q_text_${i}`).value.trim() || `سؤال ${i + 1}`;
                const imageData = document.getElementById(`ocr_q_image_${i}`).value;
                const imageMime = document.getElementById(`ocr_q_mime_${i}`).value;
                const qType = document.getElementById(`ocr_q_type_${i}`).value || questionType;

                if (qType === 'essay') {
                    const essayAnswer = document.getElementById(`ocr_q_essay_${i}`).value.trim();
                    questions.push({
                        text,
                        options: [],
                        correct: null,
                        questionType: 'essay',
                        essayAnswer: essayAnswer || '',
                        imageData,
                        imageMime
                    });
                } else {
                    const options = [];
                    for (let j = 0; j < 4; j++) {
                        const opt = document.getElementById(`ocr_q_opt_${i}_${j}`).value.trim();
                        if (opt) options.push(opt);
                    }
                    if (options.length < 2) {
                        alert(`السؤال ${i + 1} يحتاج إلى خيارين على الأقل.`);
                        submitBtn.classList.remove('loading');
                        submitBtn.textContent = '✅ نشر الامتحان';
                        return;
                    }
                    const correct = parseInt(document.getElementById(`ocr_q_correct_${i}`).value || 0);
                    questions.push({
                        text,
                        options,
                        correct,
                        questionType: 'multiple_choice',
                        imageData,
                        imageMime
                    });
                }
            }

            try {
                const formData = new FormData();
                formData.append('groupId', groupId);
                formData.append('groupSlug', groupSlug);
                formData.append('questionType', questionType);
                formData.append('examType', 'ocr');
                
                // إضافة الصور كملفات
                for (const img of uploadedImages) {
                    formData.append('images', img.file);
                }
                
                formData.append('questions', JSON.stringify(questions));

                const response = await fetch(`${API_URL}/api/exams/ocr`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    },
                    body: formData
                });

                if (response.status === 401 || response.status === 403) {
                    localStorage.removeItem('token');
                    window.location.href = '/login';
                    return;
                }

                const result = await response.json();
                if (result.success) {
                    alert(`✅ تم إنشاء الامتحان من ${ocrResults.length} صورة ونشره بنجاح!`);
                    window.location.href = '/dashboard';
                } else {
                    alert('❌ حدث خطأ في إنشاء الامتحان: ' + (result.error || ''));
                }
            } catch (error) {
                alert('❌ حدث خطأ في إنشاء الامتحان.');
                console.error(error);
            } finally {
                submitBtn.classList.remove('loading');
                submitBtn.textContent = '✅ نشر الامتحان';
            }
        }

        loadGroups();
    </script>
</body>
</html>
