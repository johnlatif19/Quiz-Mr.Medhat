<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء امتحان يدوي - Quiz Mr. Medhat</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #f0f4f8;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }
        .container { max-width: 900px; margin: 0 auto; }
        .header {
            background: white;
            padding: 20px 30px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .header h1 { font-size: 22px; color: #1a2a3a; }
        .header h1 span { color: #1d6f9c; }
        .btn-back {
            padding: 8px 20px;
            background: #6c757d;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
        }
        .btn-back:hover { background: #5a6268; }
        .card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            margin-bottom: 20px;
        }
        .card-title {
            font-size: 18px;
            font-weight: 600;
            color: #1a2a3a;
            margin-bottom: 15px;
        }
        .form-group { margin-bottom: 15px; }
        .form-group label {
            display: block;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 5px;
            font-size: 14px;
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 8px 12px;
            border: 2px solid #dce4ec;
            border-radius: 6px;
            font-size: 14px;
        }
        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #2c6f9c;
        }
        .btn {
            padding: 10px 25px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
        }
        .btn-success { background: #27ae60; color: white; }
        .btn-success:hover { background: #219a52; }
        .btn-danger { background: #e74c3c; color: white; }
        .btn-danger:hover { background: #c0392b; }
        .btn-primary { background: #2c6f9c; color: white; }
        .btn-primary:hover { background: #1f5a7a; }
        .btn-warning { background: #f39c12; color: white; }
        .btn-warning:hover { background: #d68910; }
        .question-item {
            background: #f7f9fc;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            border: 1px solid #e8edf3;
        }
        .question-item .q-number {
            font-weight: 600;
            color: #2c6f9c;
            margin-bottom: 10px;
        }
        .question-options {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .question-options .opt-group {
            flex: 1;
            min-width: 100px;
        }
        .question-options .opt-group label {
            font-size: 12px;
            color: #7f8c8d;
        }
        .question-options .opt-group input {
            width: 100%;
            padding: 4px 8px;
            border: 1px solid #dce4ec;
            border-radius: 4px;
        }
        .question-type-select {
            display: flex;
            gap: 15px;
            margin: 10px 0;
        }
        .question-type-select label {
            display: flex;
            align-items: center;
            gap: 5px;
            font-weight: normal;
            cursor: pointer;
        }
        .hidden { display: none; }
        .essay-options { display: none; }
        .essay-options.visible { display: block; }
        .multiple-choice-options { display: block; }
        .multiple-choice-options.hidden { display: none; }
        @media (max-width: 768px) {
            .header { flex-direction: column; align-items: stretch; text-align: center; }
            .question-options { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📝 إنشاء امتحان <span>يدوي</span></h1>
            <div>
                <a href="/dashboard" class="btn-back">⬅ العودة للوحة التحكم</a>
            </div>
        </div>

        <div class="card">
            <form id="examForm" onsubmit="createExam(event)">
                <div class="form-group">
                    <label>اختر المجموعة</label>
                    <select id="groupSelect" required>
                        <option value="">-- اختر مجموعة --</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>عدد الأسئلة</label>
                    <input type="number" id="questionCount" value="3" min="1" max="50">
                    <button type="button" class="btn btn-primary" onclick="updateQuestions()" style="margin-top:5px;">تحديث الأسئلة</button>
                </div>

                <div id="questionsContainer"></div>

                <div style="display:flex;gap:10px;margin-top:15px;flex-wrap:wrap;">
                    <button type="submit" class="btn btn-success">✅ نشر الامتحان</button>
                    <button type="button" class="btn btn-warning" onclick="window.location.href='/dashboard'">إلغاء</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_URL = window.location.origin;
        const token = localStorage.getItem('token');

        if (!token) {
            window.location.href = '/login';
        }

        async function loadGroups() {
            try {
                const response = await fetch(`${API_URL}/api/groups`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (response.status === 401 || response.status === 403) {
                    localStorage.removeItem('token');
                    window.location.href = '/login';
                    return;
                }
                const data = await response.json();
                const select = document.getElementById('groupSelect');
                select.innerHTML = '<option value="">-- اختر مجموعة --</option>';
                data.forEach(g => {
                    select.innerHTML += `<option value="${g.id}" data-slug="${g.slug}">${g.name}</option>`;
                });
                if (data.length === 0) {
                    select.innerHTML = '<option value="">لا توجد مجموعات. أضف مجموعة أولاً.</option>';
                }
            } catch (error) {
                console.error('Error loading groups:', error);
            }
        }

        function updateQuestions() {
            const count = parseInt(document.getElementById('questionCount').value) || 3;
            const container = document.getElementById('questionsContainer');
            let html = '';
            for (let i = 0; i < count; i++) {
                html += `
                    <div class="question-item">
                        <div class="q-number">السؤال ${i + 1}</div>
                        <div class="form-group">
                            <label>نص السؤال</label>
                            <input type="text" id="q_text_${i}" placeholder="أدخل نص السؤال" required>
                        </div>
                        <div class="question-type-select">
                            <label>
                                <input type="radio" name="q_type_${i}" value="multiple_choice" checked onchange="toggleQuestionType(${i})">
                                اختيار من متعدد
                            </label>
                            <label>
                                <input type="radio" name="q_type_${i}" value="essay" onchange="toggleQuestionType(${i})">
                                مقالي (نص)
                            </label>
                        </div>
                        <div id="multiple_choice_${i}" class="multiple-choice-options">
                            <div class="question-options">
                                <div class="opt-group">
                                    <label>A</label>
                                    <input type="text" id="q_opt_${i}_0" placeholder="اختيار A">
                                </div>
                                <div class="opt-group">
                                    <label>B</label>
                                    <input type="text" id="q_opt_${i}_1" placeholder="اختيار B">
                                </div>
                                <div class="opt-group">
                                    <label>C</label>
                                    <input type="text" id="q_opt_${i}_2" placeholder="اختيار C">
                                </div>
                                <div class="opt-group">
                                    <label>D</label>
                                    <input type="text" id="q_opt_${i}_3" placeholder="اختيار D">
                                </div>
                            </div>
                            <div class="form-group" style="margin-top:5px;">
                                <label>الإجابة الصحيحة</label>
                                <select id="q_correct_${i}">
                                    <option value="0">A</option>
                                    <option value="1">B</option>
                                    <option value="2">C</option>
                                    <option value="3">D</option>
                                </select>
                            </div>
                        </div>
                        <div id="essay_${i}" class="essay-options">
                            <div class="form-group">
                                <label>إجابة نموذجية (اختياري)</label>
                                <textarea id="q_essay_answer_${i}" rows="2" placeholder="أدخل إجابة نموذجية للسؤال المقالي"></textarea>
                            </div>
                            <div style="color:#7f8c8d;font-size:13px;">
                                ⚠️ الأسئلة المقالية ستحتاج إلى تقييم يدوي من قبل المدرس
                            </div>
                        </div>
                    </div>
                `;
            }
            container.innerHTML = html;
        }

        function toggleQuestionType(index) {
            const type = document.querySelector(`input[name="q_type_${index}"]:checked`).value;
            const mcDiv = document.getElementById(`multiple_choice_${index}`);
            const essayDiv = document.getElementById(`essay_${index}`);
            
            if (type === 'multiple_choice') {
                mcDiv.classList.remove('hidden');
                mcDiv.classList.add('multiple-choice-options');
                essayDiv.classList.remove('visible');
                essayDiv.classList.add('essay-options');
            } else {
                mcDiv.classList.add('hidden');
                mcDiv.classList.remove('multiple-choice-options');
                essayDiv.classList.add('visible');
                essayDiv.classList.remove('essay-options');
            }
        }

        async function createExam(e) {
            e.preventDefault();
            const groupSelect = document.getElementById('groupSelect');
            const groupId = groupSelect.value;
            const groupSlug = groupSelect.options[groupSelect.selectedIndex]?.dataset?.slug;
            const count = parseInt(document.getElementById('questionCount').value);

            if (!groupId) { alert('الرجاء اختيار مجموعة.'); return; }

            const questions = [];
            for (let i = 0; i < count; i++) {
                const text = document.getElementById(`q_text_${i}`).value.trim();
                const questionType = document.querySelector(`input[name="q_type_${i}"]:checked`).value;
                
                if (!text) {
                    alert(`الرجاء إدخال نص السؤال ${i + 1}`);
                    return;
                }

                if (questionType === 'multiple_choice') {
                    const options = [];
                    for (let j = 0; j < 4; j++) {
                        const opt = document.getElementById(`q_opt_${i}_${j}`).value.trim();
                        if (opt) options.push(opt);
                    }
                    if (options.length < 2) {
                        alert(`السؤال ${i + 1} يحتاج إلى خيارين على الأقل.`);
                        return;
                    }
                    const correct = parseInt(document.getElementById(`q_correct_${i}`).value);
                    questions.push({ text, options, correct, questionType: 'multiple_choice' });
                } else {
                    // مقالي
                    const essayAnswer = document.getElementById(`q_essay_answer_${i}`).value.trim();
                    questions.push({ 
                        text, 
                        options: [], 
                        correct: null, 
                        questionType: 'essay',
                        essayAnswer: essayAnswer || '' 
                    });
                }
            }

            try {
                const response = await fetch(`${API_URL}/api/exams`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ groupId, groupSlug, questions })
                });
                if (response.status === 401 || response.status === 403) {
                    localStorage.removeItem('token');
                    window.location.href = '/login';
                    return;
                }
                const result = await response.json();
                if (result.id || result.success) {
                    alert('✅ تم إنشاء الامتحان ونشره بنجاح!');
                    window.location.href = '/dashboard';
                } else {
                    alert('❌ حدث خطأ في إنشاء الامتحان.');
                }
            } catch (error) {
                alert('❌ حدث خطأ في إنشاء الامتحان.');
                console.error(error);
            }
        }

        // تحميل المجموعات وتحديث الأسئلة الافتراضية
        loadGroups();
        setTimeout(updateQuestions, 100);
    </script>
</body>
</html>
