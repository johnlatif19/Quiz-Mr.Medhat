<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5">
    <title>Quiz Mr. Medhat</title>
    <style>
        /* نفس الـ styles السابقة مع إضافة */
        /* أضف هذه الإضافات للـ CSS */
        .exam-header {
            background: #eef3f9;
            padding: 15px 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            text-align: center;
        }
        .exam-header .group-name {
            font-size: 1.4rem;
            font-weight: 600;
            color: #0b1e33;
        }
        .exam-header .exam-info {
            color: #4a5a6a;
            font-size: 0.95rem;
            margin-top: 4px;
        }
        .attempt-error {
            background: #fde8e8;
            color: #c0392b;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            margin: 20px 0;
        }
    </style>
</head>
<body>
<div class="quiz-container" id="app">
    <!-- Name Entry Screen -->
    <div id="nameEntryScreen">
        <div class="logo">Quiz <span>Mr. Medhat</span></div>
        <div class="sub-logo">اختبار قواعد اللغة الإنجليزية</div>
        <h1 id="examTitle">أهلاً بك في الاختبار</h1>
        <p id="examSubtitle">الرجاء إدخال اسمك لبدء الاختبار</p>
        <input type="text" id="userNameInput" placeholder="أدخل اسمك" maxlength="50">
        <div class="error-msg" id="nameError">الرجاء إدخال اسمك</div>
        <button class="btn-start" id="startQuizBtn">بدء الاختبار</button>
        <div id="attemptError" style="display:none;" class="attempt-error"></div>
    </div>

    <!-- Quiz Area -->
    <div id="quizArea" style="display: none;">
        <div class="exam-header">
            <div class="group-name" id="groupNameDisplay">Quiz Mr. Medhat</div>
            <div class="exam-info" id="examInfoDisplay"></div>
        </div>
        <div class="quiz-header">
            <span class="quiz-title">Quiz <span>Mr. Medhat</span></span>
            <span class="question-counter" id="questionCounter">0 / 0</span>
        </div>
        <div class="progress-bar-track">
            <div class="progress-fill" id="progressFill" style="width: 0%;"></div>
        </div>

        <div id="quizContent">
            <div class="question-card">
                <div class="question-text" id="questionText">Loading question…</div>
                <div class="options-grid" id="optionsContainer"></div>
            </div>
            <div class="nav-bar">
                <div class="nav-group">
                    <button class="btn btn-outline" id="prevBtn" disabled>السابق</button>
                    <button class="btn btn-outline" id="nextBtn">التالي</button>
                </div>
                <button class="btn submit-btn" id="submitBtn">إنهاء الاختبار</button>
            </div>
        </div>
        <div id="emptyQuizMessage" class="empty-quiz-msg" style="display: none;">
            <h2>لا توجد أسئلة</h2>
            <p>لم يتم إضافة أي أسئلة لهذا الامتحان.</p>
        </div>
    </div>

    <!-- Results -->
    <div id="resultsArea" class="results-container">
        <div class="results-card" id="resultsContent"></div>
        <div class="report-actions">
            <button class="btn btn-report" id="shareReportBtn">عرض التقرير</button>
            <button class="btn btn-restart" id="restartBtn">إعادة الاختبار</button>
        </div>
        <div id="shareReportBox" class="share-report-box hidden"></div>
    </div>
</div>

<script>
    (function() {
        const API_URL = window.location.origin;
        const pathParts = window.location.pathname.split('/');
        const groupSlug = pathParts[1] || '';

        let userName = '';
        let questions = [];
        let answers = [];
        let currentIndex = 0;
        let submitted = false;
        let examId = null;
        let hasAttempted = false;

        const nameEntryScreen = document.getElementById('nameEntryScreen');
        const quizArea = document.getElementById('quizArea');
        const resultsArea = document.getElementById('resultsArea');
        const userNameInput = document.getElementById('userNameInput');
        const startBtn = document.getElementById('startQuizBtn');
        const nameError = document.getElementById('nameError');
        const questionText = document.getElementById('questionText');
        const optionsContainer = document.getElementById('optionsContainer');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const submitBtn = document.getElementById('submitBtn');
        const progressFill = document.getElementById('progressFill');
        const questionCounter = document.getElementById('questionCounter');
        const resultsContent = document.getElementById('resultsContent');
        const shareReportBtn = document.getElementById('shareReportBtn');
        const restartBtn = document.getElementById('restartBtn');
        const shareReportBox = document.getElementById('shareReportBox');
        const quizContent = document.getElementById('quizContent');
        const emptyQuizMessage = document.getElementById('emptyQuizMessage');
        const groupNameDisplay = document.getElementById('groupNameDisplay');
        const examInfoDisplay = document.getElementById('examInfoDisplay');
        const attemptError = document.getElementById('attemptError');

        // Check if we're on a group page
        if (groupSlug) {
            document.getElementById('examTitle').textContent = `اختبار مجموعة ${groupSlug}`;
            document.getElementById('examSubtitle').textContent = `الرجاء إدخال اسمك لبدء اختبار ${groupSlug}`;
        } else {
            document.getElementById('examTitle').textContent = 'أهلاً بك في الاختبار';
            document.getElementById('examSubtitle').textContent = 'الرجاء إدخال اسمك لبدء الاختبار';
        }

        async function loadExamQuestions() {
            try {
                let url = `${API_URL}/api/questions`;
                if (groupSlug) {
                    // Get exam for this group
                    const examResponse = await fetch(`${API_URL}/api/exam/${groupSlug}`);
                    if (examResponse.status === 404) {
                        document.getElementById('examSubtitle').textContent = 'لا يوجد امتحان منشور لهذه المجموعة.';
                        return;
                    }
                    const examData = await examResponse.json();
                    if (examData.exam) {
                        examId = examData.exam.id;
                        questions = examData.questions || [];
                        groupNameDisplay.textContent = `مجموعة ${groupSlug}`;
                        examInfoDisplay.textContent = `عدد الأسئلة: ${questions.length}`;
                        return questions;
                    }
                }
                
                // Fallback - load all questions
                const response = await fetch(`${API_URL}/api/questions`);
                const data = await response.json();
                questions = data;
                return questions;
            } catch (error) {
                console.error('Error loading questions:', error);
                questions = [];
                return questions;
            }
        }

        async function checkAttempt() {
            if (!groupSlug || !userName) return false;
            try {
                // We'll check on the server when submitting
                return false;
            } catch (error) {
                return false;
            }
        }

        startBtn.addEventListener('click', async function() {
            const name = userNameInput.value.trim();
            if (!name) {
                nameError.style.display = 'block';
                return;
            }
            nameError.style.display = 'none';
            userName = name;

            await loadExamQuestions();
            
            if (questions.length === 0) {
                attemptError.textContent = 'لا توجد أسئلة لهذا الامتحان. يرجى التواصل مع المدرس.';
                attemptError.style.display = 'block';
                return;
            }

            answers = new Array(questions.length).fill(null);
            currentIndex = 0;
            submitted = false;
            nameEntryScreen.style.display = 'none';
            quizArea.style.display = 'block';
            resultsArea.style.display = 'none';
            attemptError.style.display = 'none';
            
            quizContent.style.display = 'block';
            emptyQuizMessage.style.display = 'none';
            renderQuestion(0);
        });

        userNameInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                startBtn.click();
            }
        });

        function renderQuestion(index) {
            if (!questions || questions.length === 0) return;
            const q = questions[index];
            questionText.textContent = q.text;
            optionsContainer.innerHTML = '';
            const letters = ['A', 'B', 'C', 'D', 'E', 'F'];
            q.options.forEach((opt, idx) => {
                const btn = document.createElement('div');
                btn.className = 'option-btn';
                if (answers[index] === idx) btn.classList.add('selected');
                btn.innerHTML = `<span class="letter">${letters[idx]}</span> ${opt}`;
                btn.dataset.index = idx;
                btn.addEventListener('click', () => selectOption(index, idx));
                optionsContainer.appendChild(btn);
            });

            questionCounter.textContent = `${index+1} / ${questions.length}`;
            const pct = ((index+1) / questions.length) * 100;
            progressFill.style.width = pct + '%';

            prevBtn.disabled = (index === 0);
            nextBtn.disabled = (index === questions.length - 1);
        }

        function selectOption(qIndex, optIndex) {
            if (submitted) return;
            answers[qIndex] = optIndex;
            renderQuestion(currentIndex);
        }

        function goTo(index) {
            if (index < 0 || index >= questions.length) return;
            currentIndex = index;
            renderQuestion(currentIndex);
        }

        prevBtn.addEventListener('click', () => goTo(currentIndex - 1));
        nextBtn.addEventListener('click', () => goTo(currentIndex + 1));

        submitBtn.addEventListener('click', function() {
            if (submitted) return;
            if (questions.length === 0) return;
            const unanswered = answers.filter(a => a === null).length;
            if (unanswered > 0) {
                if (!confirm(`لديك ${unanswered} سؤال(أسئلة) لم تجب عليها. هل تريد الإنهاء؟`)) return;
            } else {
                if (!confirm('هل أنت متأكد من إنهاء الاختبار؟')) return;
            }
            submitted = true;
            submitAnswers();
        });

        async function submitAnswers() {
            try {
                const payload = {
                    groupSlug: groupSlug || 'default',
                    studentName: userName,
                    answers: answers
                };

                const response = await fetch(`${API_URL}/api/submit-exam`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                if (response.status === 409) {
                    alert('لقد قمت بالفعل بتأدية هذا الاختبار. لا يمكنك إعادة المحاولة.');
                    // Show results anyway
                    displayLocalResults();
                    return;
                }

                const result = await response.json();
                if (result.success) {
                    displayResults(result.submission);
                } else {
                    displayLocalResults();
                }
            } catch (error) {
                console.error('Submit error:', error);
                displayLocalResults();
            }
        }

        function displayLocalResults() {
            let correct = 0;
            const results = questions.map((q, idx) => {
                const selected = answers[idx];
                const isCorrect = selected === q.correct;
                if (isCorrect) correct++;
                return {
                    question: q.text,
                    selected,
                    correct: q.correct,
                    isCorrect,
                    options: q.options
                };
            });
            displayResults({
                studentName: userName,
                groupSlug: groupSlug || 'default',
                total: questions.length,
                correct,
                score: Math.round((correct / questions.length) * 100),
                results
            });
        }

        function displayResults(result) {
            const { total, correct, score, results } = result;
            const wrong = results ? results.filter(r => r.selected !== null && !r.isCorrect).length : 0;
            const unanswered = results ? results.filter(r => r.selected === null).length : 0;
            const performance = score >= 80 ? 'ممتاز' : score >= 60 ? 'جيد' : score >= 40 ? 'مقبول' : 'يحتاج تحسين';

            let reviewHtml = '';
            results.forEach((r, i) => {
                const selectedLetter = r.selected !== null ? String.fromCharCode(65 + r.selected) : '—';
                const correctLetter = String.fromCharCode(65 + r.correct);
                const isCorrect = r.isCorrect;
                const isWrong = r.selected !== null && !r.isCorrect;
                const isUnanswered = r.selected === null;
                let cls = 'review-item';
                if (isCorrect) cls += ' correct';
                else if (isWrong) cls += ' wrong';
                else cls += ' unanswered';

                reviewHtml += `<div class="${cls}">
                    <span class="q-preview">س${i+1}</span>
                    <span class="answer-detail">
                        ${isCorrect ? '✓' : isWrong ? '✗' : '—'}
                        إجابتك: <span class="student-ans">${selectedLetter}</span>
                        ${!isCorrect ? ` · الإجابة الصحيحة: <span class="correct-ans">${correctLetter}</span>` : ''}
                    </span>
                </div>`;
            });

            resultsContent.innerHTML = `
                <div class="score-row">
                    <span class="score-big">${correct} / ${total}</span>
                    <span class="stat-badge">${score}%</span>
                    <span class="stat-badge stat-correct">✓ ${correct} صحيحة</span>
                    <span class="stat-badge stat-wrong">✗ ${wrong} خاطئة</span>
                    <span class="stat-badge stat-unanswered">— ${unanswered} لم تجب</span>
                </div>
                <div style="margin: 0.8rem 0 0.2rem 0; font-weight: 500; font-size: 1.1rem;">التقييم: ${performance}</div>
                <div style="margin: 0.3rem 0 0.8rem 0; color: #4a5a6a; font-size: 0.95rem;">الاسم: ${result.studentName || userName}</div>
                <div style="margin-bottom: 0.8rem; color: #4a5a6a; font-size: 0.95rem;">المجموعة: ${result.groupSlug || groupSlug || 'عام'}</div>
                <div class="review-list">${reviewHtml}</div>
            `;

            quizArea.style.display = 'none';
            resultsArea.style.display = 'block';
            shareReportBox.classList.add('hidden');

            let reportLines = [];
            reportLines.push('تقرير اختبار القواعد');
            reportLines.push(`الاسم: ${result.studentName || userName}`);
            reportLines.push(`المجموعة: ${result.groupSlug || groupSlug || 'عام'}`);
            reportLines.push(`النتيجة: ${correct} / ${total} (${score}%)`);
            reportLines.push(`صحيح: ${correct} | خاطئ: ${wrong} | لم يجب: ${unanswered}`);
            reportLines.push(`التقييم: ${performance}`);
            reportLines.push('');
            reportLines.push('— الإجابات الخاطئة —');
            let hasWrong = false;
            results.forEach((r, i) => {
                if (r.selected !== null && !r.isCorrect) {
                    hasWrong = true;
                    const selectedLetter = String.fromCharCode(65 + r.selected);
                    const correctLetter = String.fromCharCode(65 + r.correct);
                    reportLines.push(`س${i+1}: إجابتك ${selectedLetter} | الصحيح ${correctLetter}`);
                }
            });
            if (!hasWrong) reportLines.push('جميع الإجابات صحيحة!');
            window._reportText = reportLines.join('\n');
            shareReportBox.textContent = window._reportText;
        }

        shareReportBtn.addEventListener('click', function() {
            if (shareReportBox.classList.contains('hidden')) {
                shareReportBox.classList.remove('hidden');
                navigator.clipboard?.writeText(window._reportText || '').catch(() => {});
            } else {
                shareReportBox.classList.add('hidden');
            }
        });

        restartBtn.addEventListener('click', function() {
            if (!confirm('إعادة الاختبار؟ سيتم فقدان التقدم الحالي.')) return;
            answers.fill(null);
            submitted = false;
            currentIndex = 0;
            quizArea.style.display = 'block';
            resultsArea.style.display = 'none';
            shareReportBox.classList.add('hidden');
            if (questions.length > 0) {
                quizContent.style.display = 'block';
                emptyQuizMessage.style.display = 'none';
                renderQuestion(0);
            } else {
                quizContent.style.display = 'none';
                emptyQuizMessage.style.display = 'block';
            }
        });

        // Load questions on page load
        loadExamQuestions().then(() => {
            nameEntryScreen.style.display = 'block';
            quizArea.style.display = 'none';
            resultsArea.style.display = 'none';
        });
    })();
</script>
</body>
</html>
