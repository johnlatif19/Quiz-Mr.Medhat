<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - Quiz Mr. Medhat</title>
    <style>
        /* ===== إعادة تعيين القيم ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #e8edf3 0%, #d5dce6 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* ===== بطاقة تسجيل الدخول ===== */
        .login-card {
            background: #ffffff;
            padding: 45px 40px 35px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 20, 40, 0.15), 0 8px 20px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 420px;
            transition: transform 0.2s ease;
            border: 1px solid rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(2px);
        }

        .login-card:hover {
            transform: translateY(-2px);
        }

        /* ===== الشعار ===== */
        .brand {
            text-align: center;
            margin-bottom: 6px;
        }

        .brand .logo {
            font-size: 30px;
            font-weight: 800;
            color: #0a1e2f;
            letter-spacing: -0.5px;
        }

        .brand .logo span {
            color: #1a6d9c;
            background: rgba(26, 109, 156, 0.08);
            padding: 0 6px;
            border-radius: 6px;
        }

        .brand .subtitle {
            color: #6e7e8e;
            font-size: 15px;
            margin-top: 4px;
            font-weight: 400;
            letter-spacing: 0.3px;
        }

        .brand .divider {
            width: 60px;
            height: 3px;
            background: linear-gradient(90deg, #1a6d9c, #7fb9d9);
            margin: 12px auto 24px;
            border-radius: 10px;
        }

        /* ===== حقول النموذج ===== */
        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            color: #1e2f3d;
            margin-bottom: 6px;
            font-size: 14px;
            letter-spacing: 0.2px;
        }

        .form-group label i {
            margin-left: 6px;
            opacity: 0.6;
        }

        .form-group input[type="text"],
        .form-group input[type="password"] {
            width: 100%;
            padding: 13px 16px;
            border: 2px solid #e2e9f0;
            border-radius: 12px;
            font-size: 15px;
            background: #f9fbfd;
            transition: all 0.25s ease;
            font-family: inherit;
            color: #1a2a3a;
        }

        .form-group input:focus {
            outline: none;
            border-color: #1a6d9c;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(26, 109, 156, 0.12);
        }

        .form-group input::placeholder {
            color: #a8b8c8;
            font-weight: 300;
            font-size: 14px;
        }

        /* ===== حاوية كلمة المرور ===== */
        .password-wrapper {
            position: relative;
            width: 100%;
        }

        .password-wrapper input {
            padding-left: 50px !important;
            /* مساحة للزر */;
        }

        /* ===== زر إظهار/إخفاء ===== */
        .toggle-password {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 20px;
            color: #7a8a9a;
            padding: 6px 8px;
            border-radius: 8px;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }

        .toggle-password:hover {
            background: #eef4f9;
            color: #0f2a44;
            transform: translateY(-50%) scale(1.05);
        }

        .toggle-password:focus-visible {
            outline: 2px solid #1a6d9c;
            outline-offset: 2px;
        }

        .toggle-password:active {
            background: #d6e2ed;
        }

        /* ===== زر الدخول ===== */
        .btn-login {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #153b5a, #1a6d9c);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s ease;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 12px rgba(26, 109, 156, 0.25);
            margin-top: 4px;
        }

        .btn-login:hover {
            background: linear-gradient(135deg, #0f2e47, #135a82);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(26, 109, 156, 0.35);
        }

        .btn-login:active {
            transform: translateY(0);
            box-shadow: 0 2px 8px rgba(26, 109, 156, 0.2);
        }

        /* ===== رسالة الخطأ ===== */
        .error {
            color: #b3362a;
            background: #fdeeeb;
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 18px;
            display: none;
            font-size: 14px;
            border-right: 4px solid #c0392b;
            font-weight: 500;
        }

        .error.show {
            display: block;
            animation: fadeSlide 0.3s ease;
        }

        @keyframes fadeSlide {
            0% {
                opacity: 0;
                transform: translateY(-8px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== الروابط ===== */
        .footer-links {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid #eef3f8;
        }

        .footer-links a {
            color: #1a6d9c;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .footer-links a:hover {
            color: #0d3e5c;
            text-decoration: underline;
        }

        .footer-links .back-link {
            color: #6e7e8e;
            font-weight: 400;
        }

        .footer-links .back-link:hover {
            color: #1a3a5c;
        }

        /* ===== التجاوب الكامل ===== */

        /* الهواتف المتوسطة */
        @media (max-width: 480px) {
            .login-card {
                padding: 28px 18px 24px;
                border-radius: 18px;
            }

            .brand .logo {
                font-size: 24px;
            }

            .brand .subtitle {
                font-size: 13px;
            }

            .form-group input[type="text"],
            .form-group input[type="password"] {
                padding: 11px 14px;
                font-size: 14px;
            }

            .password-wrapper input {
                padding-left: 44px !important;
            }

            .toggle-password {
                font-size: 18px;
                left: 10px;
                padding: 4px 6px;
            }

            .btn-login {
                padding: 13px;
                font-size: 15px;
            }

            .footer-links {
                flex-direction: column;
                gap: 10px;
                align-items: center;
            }

            .footer-links a {
                font-size: 13px;
            }
        }

        /* الهواتف الصغيرة جداً */
        @media (max-width: 360px) {
            .login-card {
                padding: 18px 12px 16px;
                border-radius: 14px;
            }

            .brand .logo {
                font-size: 20px;
            }

            .brand .subtitle {
                font-size: 12px;
                margin-top: 2px;
            }

            .brand .divider {
                width: 40px;
                margin: 8px auto 18px;
            }

            .form-group {
                margin-bottom: 16px;
            }

            .form-group label {
                font-size: 13px;
            }

            .form-group input[type="text"],
            .form-group input[type="password"] {
                padding: 9px 12px;
                font-size: 13px;
                border-radius: 10px;
            }

            .password-wrapper input {
                padding-left: 38px !important;
            }

            .toggle-password {
                font-size: 16px;
                left: 6px;
                padding: 2px 4px;
            }

            .btn-login {
                padding: 11px;
                font-size: 14px;
                border-radius: 10px;
            }

            .error {
                font-size: 12px;
                padding: 10px 12px;
            }

            .footer-links a {
                font-size: 12px;
            }
        }

        /* الشاشات الكبيرة */
        @media (min-width: 1200px) {
            .login-card {
                max-width: 460px;
                padding: 52px 48px 40px;
                border-radius: 28px;
            }

            .brand .logo {
                font-size: 34px;
            }

            .form-group input[type="text"],
            .form-group input[type="password"] {
                padding: 15px 18px;
                font-size: 16px;
            }

            .password-wrapper input {
                padding-left: 58px !important;
            }

            .toggle-password {
                font-size: 22px;
                left: 16px;
            }

            .btn-login {
                padding: 17px;
                font-size: 18px;
            }
        }

        /* للشاشات العريضة جداً */
        @media (min-width: 1600px) {
            .login-card {
                max-width: 500px;
                padding: 60px 56px 44px;
            }
        }

        /* دعم الوضع المظلم (اختياري) */
        @media (prefers-color-scheme: dark) {
            body {
                background: linear-gradient(135deg, #141f2b, #1a2a3a);
            }

            .login-card {
                background: #1e2f3e;
                border-color: rgba(255, 255, 255, 0.06);
                box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            }

            .brand .logo {
                color: #eaf0f6;
            }

            .brand .logo span {
                color: #6cb3e0;
                background: rgba(108, 179, 224, 0.12);
            }

            .brand .subtitle {
                color: #9aabb8;
            }

            .brand .divider {
                background: linear-gradient(90deg, #6cb3e0, #3d8ab0);
            }

            .form-group label {
                color: #d0dce6;
            }

            .form-group input[type="text"],
            .form-group input[type="password"] {
                background: #14222e;
                border-color: #2d4052;
                color: #eaf0f6;
            }

            .form-group input:focus {
                border-color: #6cb3e0;
                background: #1a2d3d;
                box-shadow: 0 0 0 4px rgba(108, 179, 224, 0.15);
            }

            .form-group input::placeholder {
                color: #6a7f8f;
            }

            .toggle-password {
                color: #8aa3b5;
            }

            .toggle-password:hover {
                background: #2a4052;
                color: #c0d6e6;
            }

            .btn-login {
                background: linear-gradient(135deg, #1f4b6b, #2f7aaa);
                box-shadow: 0 4px 16px rgba(47, 122, 170, 0.3);
            }

            .btn-login:hover {
                background: linear-gradient(135deg, #163c55, #25668e);
                box-shadow: 0 8px 24px rgba(47, 122, 170, 0.4);
            }

            .error {
                background: #2d1f1e;
                color: #f0a098;
                border-right-color: #d65a4a;
            }

            .footer-links {
                border-top-color: #2a3d4e;
            }

            .footer-links a {
                color: #6cb3e0;
            }

            .footer-links a:hover {
                color: #8fc9ed;
            }

            .footer-links .back-link {
                color: #8aa3b5;
            }

            .footer-links .back-link:hover {
                color: #b8cddc;
            }
        }
    </style>
</head>
<body>

    <div class="login-card">
        <!-- الشعار -->
        <div class="brand">
            <div class="logo">Quiz <span>Mr. Medhat</span></div>
            <p class="subtitle">تسجيل الدخول للوحة التحكم</p>
            <div class="divider"></div>
        </div>

        <!-- رسالة الخطأ -->
        <div id="errorMessage" class="error"></div>

        <!-- نموذج تسجيل الدخول -->
        <form id="loginForm" autocomplete="on">
            <div class="form-group">
                <label for="username">👤 اسم المستخدم</label>
                <input type="text" id="username" placeholder="أدخل اسم المستخدم" required autofocus>
            </div>

            <div class="form-group">
                <label for="password">🔒 كلمة المرور</label>
                <div class="password-wrapper">
                    <input type="password" id="password" placeholder="أدخل كلمة المرور" required>
                    <button type="button" class="toggle-password" id="togglePassword" aria-label="إظهار أو إخفاء كلمة المرور">
                        👁️
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-login">🚀 دخول</button>
        </form>

        <!-- الروابط السفلية -->
        <div class="footer-links">

    <script>
        (function() {
            'use strict';

            const API_URL = window.location.origin;

            // === عناصر واجهة المستخدم ===
            const toggleBtn = document.getElementById('togglePassword');
            const passwordInput = document.getElementById('password');
            const loginForm = document.getElementById('loginForm');
            const errorDiv = document.getElementById('errorMessage');
            const usernameInput = document.getElementById('username');

            // === تبديل إظهار/إخفاء كلمة المرور ===
            toggleBtn.addEventListener('click', function() {
                const isPassword = passwordInput.getAttribute('type') === 'password';
                passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
                this.textContent = isPassword ? '🙈' : '👁️';
                this.setAttribute('aria-label', isPassword ? 'إخفاء كلمة المرور' : 'إظهار كلمة المرور');
            });

            // === عرض الخطأ ===
            function showError(message) {
                errorDiv.textContent = message;
                errorDiv.classList.add('show');
                // إخفاء الخطأ بعد 6 ثوانٍ
                clearTimeout(window.errorTimeout);
                window.errorTimeout = setTimeout(() => {
                    errorDiv.classList.remove('show');
                }, 6000);
            }

            function hideError() {
                errorDiv.classList.remove('show');
            }

            // === معالجة تقديم النموذج ===
            loginForm.addEventListener('submit', async function(e) {
                e.preventDefault();
                hideError();

                const username = usernameInput.value.trim();
                const password = passwordInput.value.trim();

                // التحقق من الحقول الفارغة
                if (!username || !password) {
                    showError('⚠️ الرجاء إدخال اسم المستخدم وكلمة المرور.');
                    usernameInput.focus();
                    return;
                }

                // تعطيل الزر مؤقتاً لمنع النقر المزدوج
                const submitBtn = this.querySelector('.btn-login');
                const originalText = submitBtn.innerHTML;
                submitBtn.innerHTML = '⏳ جاري التحقق...';
                submitBtn.disabled = true;

                try {
                    const response = await fetch(`${API_URL}/api/login`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, password })
                    });

                    const data = await response.json();

                    if (data.success) {
                        // حفظ بيانات الجلسة
                        localStorage.setItem('token', data.token);
                        localStorage.setItem('username', username);
                        // التوجيه إلى لوحة التحكم
                        window.location.href = '/dashboard';
                    } else {
                        showError('❌ بيانات الدخول غير صحيحة. تأكد من اسم المستخدم وكلمة المرور.');
                        passwordInput.value = '';
                        passwordInput.focus();
                    }
                } catch (error) {
                    console.error('Login error:', error);
                    showError('⚠️ حدث خطأ في الاتصال بالخادم. حاول مرة أخرى.');
                } finally {
                    submitBtn.innerHTML = originalText;
                    submitBtn.disabled = false;
                }
            });

            usernameInput.addEventListener('input', hideError);
            passwordInput.addEventListener('input', hideError);
            toggleBtn.setAttribute('title', 'إظهار أو إخفاء كلمة المرور');

            console.log('✅ صفحة تسجيل الدخول جاهزة!');
        })();
    </script>

</body>
</html>
