<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - Quiz Mr. Medhat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #f0f4f8;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-container {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        .logo {
            font-size: 28px;
            font-weight: 700;
            color: #0b1e33;
            text-align: center;
            margin-bottom: 4px;
        }
        .logo span {
            color: #1d6f9c;
        }
        .subtitle {
            color: #6b7a8a;
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 6px;
            font-size: 14px;
        }

        /* حاوية كلمة المرور مع الزر */
        .password-wrapper {
            position: relative;
            width: 100%;
        }
        .password-wrapper input {
            width: 100%;
            padding: 12px 50px 12px 16px; /* مساحة للزر على اليمين */
            border: 2px solid #dce4ec;
            border-radius: 8px;
            font-size: 15px;
            transition: border-color 0.2s;
        }
        .password-wrapper input:focus {
            outline: none;
            border-color: #2c6f9c;
        }

        /* زر إظهار/إخفاء كلمة المرور */
        .toggle-password {
            position: absolute;
            left: 12px; /* في الوضع العربي الزر على اليسار */
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 20px;
            color: #6b7a8a;
            padding: 4px 8px;
            border-radius: 6px;
            transition: background 0.2s, color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }
        .toggle-password:hover {
            background: #eef2f6;
            color: #1a3a5c;
        }
        .toggle-password:focus {
            outline: 2px solid #2c6f9c;
            outline-offset: 2px;
        }

        /* لمس الشاشة (touch) */
        .toggle-password:active {
            background: #dce4ec;
        }

        button[type="submit"] {
            width: 100%;
            padding: 14px;
            background: #1a3a5c;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button[type="submit"]:hover {
            background: #0f2a44;
        }
        .error {
            color: #c0392b;
            background: #fde8e8;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            display: none;
            font-size: 14px;
        }
        .back-link {
            text-align: center;
            margin-top: 15px;
        }
        .back-link a {
            color: #2c6f9c;
            text-decoration: none;
            font-size: 14px;
        }
        .back-link a:hover {
            text-decoration: underline;
        }

        /* ===== التجاوب مع جميع الشاشات ===== */
        @media (max-width: 480px) {
            .login-container {
                padding: 24px 20px;
            }
            .logo {
                font-size: 22px;
            }
            .password-wrapper input {
                padding: 10px 46px 10px 14px;
                font-size: 14px;
            }
            .toggle-password {
                font-size: 18px;
                left: 10px;
                padding: 2px 6px;
            }
            button[type="submit"] {
                padding: 12px;
                font-size: 15px;
            }
        }

        @media (max-width: 360px) {
            .login-container {
                padding: 16px 14px;
            }
            .logo {
                font-size: 18px;
            }
            .subtitle {
                font-size: 12px;
                margin-bottom: 20px;
            }
            .password-wrapper input {
                padding: 8px 40px 8px 10px;
                font-size: 13px;
            }
            .toggle-password {
                font-size: 16px;
                left: 6px;
                padding: 2px 4px;
            }
            button[type="submit"] {
                padding: 10px;
                font-size: 14px;
            }
            .back-link a {
                font-size: 12px;
            }
        }

        /* للشاشات الكبيرة جداً */
        @media (min-width: 1200px) {
            .login-container {
                max-width: 440px;
                padding: 48px;
            }
            .logo {
                font-size: 32px;
            }
            .password-wrapper input {
                padding: 14px 56px 14px 18px;
                font-size: 16px;
            }
            .toggle-password {
                font-size: 22px;
                left: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">Quiz <span>Mr. Medhat</span></div>
        <p class="subtitle">تسجيل الدخول للتحكم</p>
        <div id="errorMessage" class="error"></div>
        <form id="loginForm">
            <div class="form-group">
                <label for="username">اسم المستخدم</label>
                <input type="text" id="username" placeholder="أدخل اسم المستخدم" required>
            </div>
            <div class="form-group">
                <label for="password">كلمة المرور</label>
                <div class="password-wrapper">
                    <input type="password" id="password" placeholder="أدخل كلمة المرور" required>
                    <button type="button" class="toggle-password" id="togglePassword" aria-label="إظهار أو إخفاء كلمة المرور">
                        👁️
                    </button>
                </div>
            </div>
            <button type="submit">دخول</button>
        </form>
        <div class="back-link">
            <a href="/">العودة إلى الاختبار</a>
        </div>
    </div>

    <script>
        const API_URL = window.location.origin;

        // زر إظهار/إخفاء كلمة المرور
        const toggleBtn = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');

        toggleBtn.addEventListener('click', function() {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            // تغيير الأيقونة (اختياري)
            this.textContent = type === 'password' ? '👁️' : '👁️‍🗨️';
        });

        // تسجيل الدخول
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.style.display = 'none';
            
            if (!username || !password) {
                errorDiv.textContent = 'الرجاء إدخال اسم المستخدم وكلمة المرور.';
                errorDiv.style.display = 'block';
                return;
            }
            
            try {
                const response = await fetch(`${API_URL}/api/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                if (data.success) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('username', username);
                    window.location.href = '/dashboard';
                } else {
                    errorDiv.textContent = 'بيانات الدخول غير صحيحة. تأكد من اسم المستخدم وكلمة المرور.';
                    errorDiv.style.display = 'block';
                }
            } catch (error) {
                errorDiv.textContent = 'حدث خطأ في الاتصال بالخادم. حاول مرة أخرى.';
                errorDiv.style.display = 'block';
                console.error('Login error:', error);
            }
        });
    </script>
</body>
</html>
