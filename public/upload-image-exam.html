<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء امتحان من صور - Quiz Mr. Medhat</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #f0f4f8;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }
        .container { max-width: 900px; margin: 0 auto; }
        .header {
            background: white;
            padding: 20px 30px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .header h1 { font-size: 22px; color: #1a2a3a; }
        .header h1 span { color: #1d6f9c; }
        .btn-back {
            padding: 8px 20px;
            background: #6c757d;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
        }
        .btn-back:hover { background: #5a6268; }
        .card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            margin-bottom: 20px;
        }
        .card-title {
            font-size: 18px;
            font-weight: 600;
            color: #1a2a3a;
            margin-bottom: 15px;
        }
        .form-group { margin-bottom: 15px; }
        .form-group label {
            display: block;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 5px;
            font-size: 14px;
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 8px 12px;
            border: 2px solid #dce4ec;
            border-radius: 6px;
            font-size: 14px;
        }
        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #2c6f9c;
        }
        .btn {
            padding: 10px 25px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
        }
        .btn-success { background: #27ae60; color: white; }
        .btn-success:hover { background: #219a52; }
        .btn-primary { background: #2c6f9c; color: white; }
        .btn-primary:hover { background: #1f5a7a; }
        .btn-warning { background: #f39c12; color: white; }
        .btn-warning:hover { background: #d68910; }
        .btn-danger { background: #e74c3c; color: white; }
        .btn-danger:hover { background: #c0392b; }
        .upload-area {
            border: 3px dashed #dce4ec;
            border-radius: 12px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: #fafbfc;
        }
        .upload-area:hover {
            border-color: #2c6f9c;
            background: #f0f4f8;
        }
        .upload-area.dragover {
            border-color: #27ae60;
            background: #eafaf1;
        }
        .upload-area .icon { font-size: 48px; display: block; margin-bottom: 10px; }
        .upload-area .text { color: #7f8c8d; font-size: 16px; }
        .image-preview-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        .image-preview-item {
            position: relative;
            border: 2px solid #dce4ec;
            border-radius: 8px;
            overflow: hidden;
            aspect-ratio: 4/3;
            background: #f7f9fc;
        }
        .image-preview-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .image-preview-item .remove-btn {
            position: absolute;
            top: 5px;
            right: 5px;
            background: rgba(231, 76, 60, 0.9);
            color: white;
            border: none;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .image-preview-item .remove-btn:hover {
            background: #c0392b;
        }
        .question-type-select {
            display: flex;
            gap: 15px;
            margin: 10px 0;
        }
        .question-type-select label {
            display: flex;
            align-items: center;
            gap: 5px;
            font-weight: normal;
            cursor: pointer;
        }
        .question-item {
            background: #f7f9fc;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            border: 1px solid #e8edf3;
        }
        .question-item .q-number {
            font-weight: 600;
            color: #2c6f9c;
            margin-bottom: 10px;
        }
        .hidden { display: none; }
        .loading { opacity: 0.6; pointer-events: none; }
        @media (max-width: 768px) {
            .header { flex-direction: column; align-items: stretch; text-align: center; }
            .image-preview-grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🖼️ إنشاء امتحان <span>من الصور</span></h1>
            <div>
                <a href="/dashboard" class="btn-back">⬅ العودة للوحة التحكم</a>
            </div>
        </div>

        <div class="card">
            <form id="examForm" onsubmit="createImageExam(event)">
                <div class="form-group">
                    <label>اختر المجموعة</label>
                    <select id="groupSelect" required>
                        <option value="">-- اختر مجموعة --</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>نوع الأسئلة</label>
                    <div class="question-type-select">
                        <label>
                            <input type="radio" name="questionType" value="multiple_choice" checked>
                            اختيار من متعدد
                        </label>
                        <label>
                            <input type="radio" name="questionType" value="essay">
                            مقالي (نص)
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label>رفع صور الأسئلة</label>
                    <div class="upload-area" id="uploadArea">
                        <span class="icon">📸</span>
                        <div class="text">اسحب الصور هنا أو انقر للاختيار</div>
                        <div style="font-size:12px;color:#aab8c8;margin-top:5px;">يدعم JPG, PNG, GIF - حتى 5MB لكل صورة</div>
                        <input type="file" id="fileInput" accept="image/*" multiple style="display:none;">
                    </div>
                    <div id="imagePreviewGrid" class="image-preview-grid"></div>
                </div>

                <div id="questionsContainer"></div>

                <div style="display:flex;gap:10px;margin-top:15px;flex-wrap:wrap;">
                    <button type="submit" class="btn btn-success" id="submitBtn">✅ نشر الامتحان</button>
                    <button type="button" class="btn btn-warning" onclick="window.location.href='/dashboard'">إلغاء</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_URL = window.location.origin;
        const token = localStorage.getItem('token');

        if (!token) {
            window.location.href = '/login';
        }

        let uploadedImages = [];
        let questionCounter = 0;

        async function loadGroups() {
            try {
                const response = await fetch(`${API_URL}/api/groups`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (response.status === 401 || response.status === 403) {
                    localStorage.removeItem('token');
                    window.location.href = '/login';
                    return;
                }
                const data = await response.json();
                const select = document.getElementById('groupSelect');
                select.innerHTML = '<option value="">-- اختر مجموعة --</option>';
                data.forEach(g => {
                    select.innerHTML += `<option value="${g.id}" data-slug="${g.slug}">${g.name}</option>`;
                });
                if (data.length === 0) {
                    select.innerHTML = '<option value="">لا توجد مجموعات. أضف مجموعة أولاً.</option>';
                }
            } catch (error) {
                console.error('Error loading groups:', error);
            }
        }

        // رفع الصور
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const previewGrid = document.getElementById('imagePreviewGrid');

        uploadArea.addEventListener('click', () => fileInput.click());

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            if (e.dataTransfer.files.length) {
                handleFiles(e.dataTransfer.files);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length) {
                handleFiles(e.target.files);
            }
            fileInput.value = '';
        });

        function handleFiles(files) {
            for (const file of files) {
                if (!file.type.startsWith('image/')) continue;
                if (file.size > 5 * 1024 * 1024) {
                    alert(`الصورة ${file.name} حجمها كبير جداً (أكبر من 5MB)`);
                    continue;
                }
                const reader = new FileReader();
                reader.onload = (e) => {
                    uploadedImages.push({
                        file: file,
                        dataUrl: e.target.result,
                        name: file.name,
                        type: file.type
                    });
                    renderPreviews();
                    generateQuestionsFromImages();
                };
                reader.readAsDataURL(file);
            }
        }

        function renderPreviews() {
            previewGrid.innerHTML = '';
            uploadedImages.forEach((img, index) => {
                const div = document.createElement('div');
                div.className = 'image-preview-item';
                div.innerHTML = `
                    <img src="${img.dataUrl}" alt="${img.name}">
                    <button class="remove-btn" onclick="removeImage(${index})">×</button>
                `;
                previewGrid.appendChild(div);
            });
        }

        function removeImage(index) {
            uploadedImages.splice(index, 1);
            renderPreviews();
            generateQuestionsFromImages();
        }

        function generateQuestionsFromImages() {
            const container = document.getElementById('questionsContainer');
            if (uploadedImages.length === 0) {
                container.innerHTML = '<div style="color:#7f8c8d;text-align:center;padding:20px;">قم برفع الصور أولاً لتوليد الأسئلة.</div>';
                return;
            }

            const questionType = document.querySelector('input[name="questionType"]:checked').value;
            let html = '<div style="margin-top:15px;padding:10px;background:#eafaf1;border-radius:8px;border:1px solid #27ae60;">';
            html += `<strong>📸 تم رفع ${uploadedImages.length} صورة</strong>`;
            html += '</div>';

            html += '<div style="margin-top:15px;">';
            uploadedImages.forEach((img, idx) => {
                html += `
                    <div class="question-item">
                        <div class="q-number">السؤال من الصورة ${idx + 1}</div>
                        <div style="margin-bottom:10px;">
                            <img src="${img.dataUrl}" style="max-width:200px;max-height:150px;border-radius:8px;border:1px solid #dce4ec;">
                        </div>
                        <div class="form-group">
                            <label>نص السؤال</label>
                            <input type="text" id="img_q_text_${idx}" placeholder="أدخل نص السؤال (اختياري - سيتم استخدام اسم الصورة كافتراضي)" value="${img.name}">
                        </div>
                        ${questionType === 'multiple_choice' ? `
                        <div class="question-options" style="display:flex;gap:10px;flex-wrap:wrap;">
                            <div class="opt-group" style="flex:1;min-width:100px;">
                                <label>A</label>
                                <input type="text" id="img_q_opt_${idx}_0" placeholder="اختيار A" value="الخيار A">
                            </div>
                            <div class="opt-group" style="flex:1;min-width:100px;">
                                <label>B</label>
                                <input type="text" id="img_q_opt_${idx}_1" placeholder="اختيار B" value="الخيار B">
                            </div>
                            <div class="opt-group" style="flex:1;min-width:100px;">
                                <label>C</label>
                                <input type="text" id="img_q_opt_${idx}_2" placeholder="اختيار C" value="الخيار C">
                            </div>
                            <div class="opt-group" style="flex:1;min-width:100px;">
                                <label>D</label>
                                <input type="text" id="img_q_opt_${idx}_3" placeholder="اختيار D" value="الخيار D">
                            </div>
                        </div>
                        <div class="form-group" style="margin-top:5px;">
                            <label>الإجابة الصحيحة</label>
                            <select id="img_q_correct_${idx}">
                                <option value="0">A</option>
                                <option value="1">B</option>
                                <option value="2">C</option>
                                <option value="3">D</option>
                            </select>
                        </div>
                        ` : `
                        <div class="form-group">
                            <label>إجابة نموذجية (اختياري)</label>
                            <textarea id="img_q_essay_${idx}" rows="2" placeholder="أدخل إجابة نموذجية للسؤال المقالي"></textarea>
                        </div>
                        <div style="color:#7f8c8d;font-size:13px;">
                            ⚠️ الأسئلة المقالية ستحتاج إلى تقييم يدوي من قبل المدرس
                        </div>
                        `}
                        <input type="hidden" id="img_q_data_${idx}" value="${img.dataUrl}">
                        <input type="hidden" id="img_q_mime_${idx}" value="${img.type}">
                    </div>
                `;
            });
            html += '</div>';
            container.innerHTML = html;
        }

        document.querySelectorAll('input[name="questionType"]').forEach(radio => {
            radio.addEventListener('change', generateQuestionsFromImages);
        });

        async function createImageExam(e) {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.classList.add('loading');
            submitBtn.textContent = '⏳ جاري النشر...';

            const groupSelect = document.getElementById('groupSelect');
            const groupId = groupSelect.value;
            const groupSlug = groupSelect.options[groupSelect.selectedIndex]?.dataset?.slug;
            const questionType = document.querySelector('input[name="questionType"]:checked').value;

            if (!groupId) {
                alert('الرجاء اختيار مجموعة.');
                submitBtn.classList.remove('loading');
                submitBtn.textContent = '✅ نشر الامتحان';
                return;
            }

            if (uploadedImages.length === 0) {
                alert('الرجاء رفع صورة واحدة على الأقل.');
                submitBtn.classList.remove('loading');
                submitBtn.textContent = '✅ نشر الامتحان';
                return;
            }

            const questions = [];
            for (let i = 0; i < uploadedImages.length; i++) {
                const text = document.getElementById(`img_q_text_${i}`).value.trim() || `سؤال من الصورة ${i + 1}`;
                const imageData = document.getElementById(`img_q_data_${i}`).value;
                const imageMime = document.getElementById(`img_q_mime_${i}`).value;

                if (questionType === 'multiple_choice') {
                    const options = [];
                    for (let j = 0; j < 4; j++) {
                        const opt = document.getElementById(`img_q_opt_${i}_${j}`).value.trim();
                        if (opt) options.push(opt);
                    }
                    if (options.length < 2) {
                        alert(`السؤال ${i + 1} يحتاج إلى خيارين على الأقل.`);
                        submitBtn.classList.remove('loading');
                        submitBtn.textContent = '✅ نشر الامتحان';
                        return;
                    }
                    const correct = parseInt(document.getElementById(`img_q_correct_${i}`).value);
                    questions.push({ 
                        text, 
                        options, 
                        correct, 
                        questionType: 'multiple_choice',
                        imageData: imageData,
                        imageMime: imageMime
                    });
                } else {
                    const essayAnswer = document.getElementById(`img_q_essay_${i}`).value.trim();
                    questions.push({ 
                        text, 
                        options: [], 
                        correct: null, 
                        questionType: 'essay',
                        essayAnswer: essayAnswer || '',
                        imageData: imageData,
                        imageMime: imageMime
                    });
                }
            }

            try {
                // استخدام FormData لإرسال الصور مع البيانات
                const formData = new FormData();
                formData.append('groupId', groupId);
                formData.append('groupSlug', groupSlug);
                formData.append('questionType', questionType);
                
                // إضافة الصور كملفات
                for (const img of uploadedImages) {
                    formData.append('images', img.file);
                }
                
                // إضافة الأسئلة كـ JSON
                formData.append('questions', JSON.stringify(questions));

                const response = await fetch(`${API_URL}/api/exams/image`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    },
                    body: formData
                });

                if (response.status === 401 || response.status === 403) {
                    localStorage.removeItem('token');
                    window.location.href = '/login';
                    return;
                }

                const result = await response.json();
                if (result.success) {
                    alert(`✅ تم إنشاء الامتحان من ${uploadedImages.length} صورة ونشره بنجاح!`);
                    window.location.href = '/dashboard';
                } else {
                    alert('❌ حدث خطأ في إنشاء الامتحان: ' + (result.error || ''));
                }
            } catch (error) {
                alert('❌ حدث خطأ في إنشاء الامتحان.');
                console.error(error);
            } finally {
                submitBtn.classList.remove('loading');
                submitBtn.textContent = '✅ نشر الامتحان';
            }
        }

        loadGroups();
    </script>
</body>
</html>
